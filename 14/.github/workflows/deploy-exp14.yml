name: CI/CD for Exp 14
on:
  push:
    paths:
      - 'Experiments/14/**'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: "./Experiments/14"
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/flask-app-exp14:latest